
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>우리 하린이 첫돌 초대장</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f8f3eb;
      color: #51473e;
      font-family: sans-serif;
      text-align: center;
      line-height: 1.8;
    }
    main {
      max-width: 480px;
      margin: 24px auto;
      padding: 28px 22px;
      background: #fffdf9;
      border-radius: 18px;
    }
    .hero {
      width: 100%;
      border-radius: 14px;
      object-fit: cover;
    }
    .sub { color: #ad8b61; letter-spacing: 3px; }
    h1 { font-size: 28px; margin: 16px 0; }
    h2 { font-size: 20px; margin-top: 30px; }
    .button {
      display: block;
      margin: 12px 0;
      padding: 12px;
      border-radius: 10px;
      background: #a98762;
      color: white;
      text-decoration: none;
    }
    .info {
      padding: 15px;
      background: #f8f3eb;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <main>
    <p class="sub">FIRST BIRTHDAY</p>

    <!-- 사진을 준비하면 아래 주소를 교체하세요 -->
    <img class="hero"
      src="https://placehold.co/600x750/f1e5d5/8c7358?text=Our+Baby"
      alt="우리 아이 사진">

    <h1>우리 아이의 첫 번째 생일</h1>
    <p>
      작은 천사로 우리에게 찾아온 소중한 아이가<br>
      어느덧 첫 번째 생일을 맞이했습니다.
    </p>
    <p>기쁜 날, 함께 축하해 주시면 감사하겠습니다.</p>

    <h2>초대합니다</h2>
    <div class="info">
      <p>📅 2026년 12월 00일 (요일)</p>
      <p>🕒 오후 12시 00분</p>
      <p>📍 ○○호텔 ○층 ○○홀</p>
    </div>

    <h2>마음 전하는 곳</h2>
    <p>계좌 안내가 필요하다면 이곳에 작성하세요.</p>

    <a class="button"
       href="https://map.naver.com/"
       target="_blank" rel="noopener">
      오시는 길
    </a>

    <a class="button"
       href="https://forms.google.com/"
       target="_blank" rel="noopener">
      참석 여부 알려주기
    </a>

    <p style="margin-top:32px;font-size:12px;color:#998b7b">
      소중한 걸음으로 함께해 주세요 ♡
    </p>
  </main>
</body>
</html>
