      function formatDate(iso) {
        var parts = iso.split("-");
        return parts[0] + "년 " + parts[1] + "월 " + parts[2] + "일";
      }

      function daysAfterBirth(iso) {
        return Math.round((Date.parse(iso) - Date.parse(birth)) / 86400000);
      }

      function captionText(item) {
        if (!item.date) return "";
        var days = daysAfterBirth(item.date);
        if (days < 0) return formatDate(item.date) + " · 태어나기 " + (-days) + "일 전";
        return formatDate(item.date) + " · D+" + (days + 1);
      }

      function renderGallery() {
        var section = document.getElementById("gallery");
        var box = document.getElementById("photos");

        var previewCount = 11;
        sources.forEach(function (item, i) {
          if (i >= previewCount) return;
          var figure = document.createElement("figure");
          figure.className = "photo";
          var button = document.createElement("button");
          button.type = "button";
          button.className = "shot";
          if (item.video) {
            button.className = "shot is-video";
            button.setAttribute("aria-label", "영상 재생");
            var thumb = document.createElement("video");
            thumb.muted = true;
            thumb.playsInline = true;
            thumb.preload = "metadata";
            thumb.src = item.src + "#t=0.1";
            thumb.setAttribute("aria-hidden", "true");
            button.appendChild(thumb);
          } else {
            button.setAttribute("aria-label", "하린이 사진 " + (i + 1) + " 크게 보기");
            var img = document.createElement("img");
            img.src = item.src;
            img.alt = "하린이 사진 " + (i + 1);
            button.appendChild(img);
          }
          button.addEventListener("click", function () { openViewer(i); });
          figure.appendChild(button);
          box.appendChild(figure);
        });
        if (sources.length > previewCount) {
          var moreFigure = document.createElement("figure");
          moreFigure.className = "photo";
          var more = document.createElement("button");
          more.type = "button";
          more.className = "more";
          more.setAttribute("aria-label", "나머지 사진 크게 보기");
          var moreLabel = document.createElement("span");
          moreLabel.textContent = "더보기";
          more.appendChild(moreLabel);
          more.addEventListener("click", function () { openViewer(previewCount); });
          moreFigure.appendChild(more);
          box.appendChild(moreFigure);
        }
        section.hidden = false;
      }

      renderGallery();

      var viewer = document.getElementById("viewer");
      var viewerImg = document.getElementById("viewer-img");
      var viewerVideo = document.getElementById("viewer-video");
      var prevBtn = document.getElementById("viewer-prev");
      var nextBtn = document.getElementById("viewer-next");
      var current = 0;

      function stopVideo() {
        viewerVideo.pause();
        viewerVideo.removeAttribute("src");
        viewerVideo.load();
      }

      function showCurrent() {
        var item = sources[current];
        var caption = document.getElementById("viewer-caption");
        caption.textContent = captionText(item);
        caption.hidden = !item.date;
        if (item.video) {
          viewerImg.hidden = true;
          viewerVideo.hidden = false;
          viewerVideo.src = item.src;
          viewerVideo.play().catch(function () {});
        } else {
          stopVideo();
          viewerVideo.hidden = true;
          viewerImg.hidden = false;
          viewerImg.src = item.src;
          viewerImg.alt = captionText(item) || "하린이 사진";
        }
        var alone = sources.length < 2;
        prevBtn.hidden = alone;
        nextBtn.hidden = alone;
      }

      function openViewer(i) {
        current = i;
        showCurrent();
        viewer.hidden = false;
        document.body.style.overflow = "hidden";
      }

      function closeViewer() {
        stopVideo();
        viewer.hidden = true;
        document.body.style.overflow = "";
      }

      document.getElementById("viewer-close").addEventListener("click", closeViewer);
      prevBtn.addEventListener("click", function () {
        current = (current - 1 + sources.length) % sources.length;
        showCurrent();
      });
      nextBtn.addEventListener("click", function () {
        current = (current + 1) % sources.length;
        showCurrent();
      });
      viewer.addEventListener("click", function (e) {
        if (e.target.closest(".viewer-bar")) return;
        current = (current + 1) % sources.length;
        showCurrent();
      });
      document.addEventListener("keydown", function (e) {
        if (viewer.hidden) return;
        if (e.key === "Escape") closeViewer();
      });
    })();
  </script>
</body>
</html>
