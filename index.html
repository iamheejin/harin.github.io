<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>우리 하린이 첫돌 초대장</title>
  <meta name="description" content="2026년 11월 14일 토요일 오후 12시, 경복궁 노원점에서 하린이의 첫 생일을 함께해 주세요.">
  <meta property="og:title" content="우리 하린이 첫돌 초대장">
  <meta property="og:description" content="2026년 11월 14일 토요일 오후 12시 · 경복궁 노원점">
  <meta property="og:type" content="website">
  <link rel="preload" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff" as="font" type="font/woff" crossorigin>
  <style>
    @font-face {
      font-family: "SeoulNamsan";
      src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff") format("woff");
      font-weight: 400 900;
      font-display: swap;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: #3a3330;
      font-family: "SeoulNamsan", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      line-height: 1.85;
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
      word-break: keep-all;
      background: #efe9e2;
    }
    .card {
      position: relative;
      max-width: 440px;
      margin: 14px auto;
      min-height: calc(100vh - 28px);
      padding: 18px 0 8px;
      border-radius: 4px;
      overflow: hidden;
      background: #fffdfa;
      box-shadow: 0 1px 2px rgba(40, 30, 20, 0.04), 0 12px 40px rgba(40, 30, 20, 0.06);
    }
    .cover,
    section,
    .button,
    footer { position: relative; z-index: 1; }
    .cover {
      padding: 42px 28px 10px;
      text-align: center;
    }
    .eyebrow {
      margin: 0;
      color: #1a1a1a;
      font-family: inherit;
      font-size: 24px;
      -webkit-text-stroke: 0.9px #1a1a1a;
      paint-order: stroke fill;
      letter-spacing: 0.24em;
    }
    .eyebrow {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-indent: 0.24em;
    }
    .sparkle {
      display: block;
      width: 36px;
      height: 1px;
      background: linear-gradient(90deg, #d9c7a8 0%, #d9c7a8 35%, #fff6dc 50%, #d9c7a8 65%, #d9c7a8 100%);
      background-size: 300% 100%;
      animation: shimmer 2.4s ease-in-out infinite;
    }
    .sparkle.late { animation-direction: reverse; }
    .frame {
      width: 236px;
      height: 308px;
      margin: 26px auto 22px;
      border-radius: 150px 150px 0 0;
      overflow: hidden;
    }
    .frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 72% 30%;
      display: block;
    }
    h1 {
      margin: 0;
      color: #1a1a1a;
      font-family: inherit;
      font-size: 50px;
      font-weight: 700;
      -webkit-text-stroke: 1.6px #1a1a1a;
      paint-order: stroke fill;
      letter-spacing: 0.32em;
      text-indent: 0.32em;
      line-height: 1.1;
      padding: 8px 0;
    }
    .countdown {
      margin: 8px 0 0;
      color: #9a7b5f;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    section { padding: 8px 28px 34px; text-align: center; }
    .rule {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 120px;
      margin: 0 auto 20px;
      color: #c4b5a5;
      font-size: 9px;
      line-height: 1;
    }
    .rule::before,
    .rule::after {
      content: "";
      height: 1px;
      flex: 1;
      background: #e3d9ce;
    }
    h2 {
      margin: 0 0 16px;
      color: #1a1a1a;
      font-family: inherit;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.14em;
    }
    .letter { padding-top: 0; }
    .letter p { margin: 0 0 8px; font-family: inherit; font-size: 15.5px; line-height: 2; }
    .gallery[hidden],
    .viewer[hidden] { display: none; }
    .photos {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 4px;
    }
    .photo { margin: 0; }
    .shot {
      display: block;
      width: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 2px;
      overflow: hidden;
      background: #f1ece6;
      aspect-ratio: 1;
      cursor: pointer;
    }
    .shot img,
    .shot video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }
    .more {
      display: block;
      width: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 2px;
      aspect-ratio: 1;
      cursor: pointer;
      background: #f1ece6;
      font-family: inherit;
      font-size: 14px;
      letter-spacing: 0.1em;
      color: #1a1a1a;
    }
    .more span {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
    }
    .shot.is-video { position: relative; }
    .shot.is-video::after {
      content: "영상";
      position: absolute;
      left: 8px;
      bottom: 8px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(20, 20, 20, 0.6);
      color: #fff;
      font-size: 12px;
    }
    .viewer {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100dvh;
      cursor: pointer;
      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
      background: rgba(14, 14, 14, 0.95);
    }
    .viewer-caption {
      flex: 0 0 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin: 0;
      padding: 0 18px;
      color: rgba(255, 255, 255, 0.85);
      font-size: 14px;
      letter-spacing: 0.04em;
      flex-direction: column;
      line-height: 1.5;
      text-align: center;
    }
    .viewer-count {
      margin-top: 2px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.55);
      letter-spacing: 0.1em;
    }
    .viewer-caption[hidden] {
      display: flex;
      visibility: hidden;
    }
    .viewer-stage {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 0;
      padding: 0 18px;
    }
    .viewer img,
    .viewer video {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 2px;
      background: #000;
    }
    .viewer img[hidden],
    .viewer video[hidden] { display: none; }
    .viewer-bar {
      flex: 0 0 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
    }
    .viewer-bar button {
      cursor: default;
      min-width: 76px;
      padding: 10px 16px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 999px;
      background: transparent;
      color: #fff;
      font-family: inherit;
      font-size: 15px;
    }
    table {
      width: 100%;
      margin-top: 18px;
      table-layout: fixed;
      border-collapse: collapse;
      font-size: 14px;
      border-top: 1px solid #e8e0d6;
      border-bottom: 1px solid #e8e0d6;
    }
    th, td { padding: 0; height: 40px; font-weight: 400; }
    th {
      height: 38px;
      color: #9a8f85;
      font-size: 11px;
      letter-spacing: 0.1em;
      border-bottom: 1px solid #f0eae3;
    }
    tbody tr:first-child td { padding-top: 8px; height: 48px; }
    tbody tr:last-child td { padding-bottom: 8px; height: 48px; }
    td { color: #3a3330; }
    td.sun, th.sun { color: #b5675f; }
    td.sat, th.sat { color: #6a7d9c; }
    td.mark span {
      display: inline-grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #1a1a1a;
      color: #fff;
    }
    .info {
      margin: 0 4px;
      padding: 4px 0;
      border-top: 1px solid #e8e0d6;
      border-bottom: 1px solid #e8e0d6;
    }
    .row {
      padding: 18px 0;
      border-bottom: 1px solid #f0eae3;
    }
    .row:last-child { border-bottom: 0; }
    .row:has(table) { border-bottom: 0; }
    .label {
      display: block;
      margin-bottom: 4px;
      color: #9a8f85;
      font-size: 12px;
      letter-spacing: 0.3em;
    }
    .row strong { font-weight: 600; color: #1a1a1a; }
    .place { margin: 2px 0 0; font-size: 14px; color: #7a716a; }
    .button {
      display: block;
      margin: 8px 32px 0;
      padding: 15px;
      border: 0;
      border-radius: 4px;
      background: #1a1a1a;
      color: #fff;
      text-align: center;
      text-decoration: none;
      font-size: 14px;
      letter-spacing: 0.2em;
    }
    footer {
      padding: 40px 28px 52px;
      text-align: center;
      color: #9a8f85;
      font-size: 13px;
      letter-spacing: 0.04em;
    }
    @keyframes shimmer {
      0% { background-position: 100% 0; }
      100% { background-position: 0 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .sparkle { animation: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <header class="cover">
      <p class="eyebrow"><span class="sparkle" aria-hidden="true"></span>첫 돌<span class="sparkle late" aria-hidden="true"></span></p>
      <!-- 상단 사진은 사진/메인.jpg 입니다 -->
      <div class="frame">
        <img src="사진/메인.jpg"
             alt="하린이 사진">
      </div>
      <h1>하린</h1>
    </header>

    <section class="letter">
      <div class="rule" aria-hidden="true">✦</div>
      <h2>초대합니다</h2>
      <p>
        작은 천사로 우리에게 찾아온<br>
        소중한 하린이가
      </p>
      <p>어느덧 첫 번째 생일을 맞이했습니다.</p>
      <p>기쁜 날, 함께 축하해 주시면<br>감사하겠습니다.</p>
    </section>

    <!-- 촬영일 기준. D+는 생일 2025년 11월 16일을 1일로 계산하고, 날짜는 사진을 열었을 때만 보입니다. -->
    <section class="gallery" id="gallery" hidden>
      <div class="rule" aria-hidden="true">✦</div>
      <h2>성장 앨범</h2>
      <div class="photos" id="photos"></div>
    </section>

    <section>
      <div class="info">
        <div class="row">
          <span class="label">일시</span>
          <strong>2026년 11월 14일 토요일</strong><br>
          오후 12시
          <p class="countdown" id="countdown"></p>
        <table aria-label="2026년 11월 달력">
          <thead>
            <tr>
              <th class="sun">일</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th class="sat">토</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="sun">1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td class="sat">7</td>
            </tr>
            <tr>
              <td class="sun">8</td><td>9</td><td>10</td><td>11</td><td>12</td><td>13</td><td class="sat mark"><span>14</span></td>
            </tr>
            <tr>
              <td class="sun">15</td><td>16</td><td>17</td><td>18</td><td>19</td><td>20</td><td class="sat">21</td>
            </tr>
            <tr>
              <td class="sun">22</td><td>23</td><td>24</td><td>25</td><td>26</td><td>27</td><td class="sat">28</td>
            </tr>
            <tr>
              <td class="sun">29</td><td>30</td><td></td><td></td><td></td><td></td><td></td>
            </tr>
          </tbody>
        </table>
        </div>
        <div class="row">
          <span class="label">장소</span>
          <strong>경복궁 노원점</strong>
          <p class="place">서울 노원구 동일로 1608</p>
        </div>
      </div>
    </section>

    <a class="button"
       href="https://map.naver.com/p/search/%EA%B2%BD%EB%B3%B5%EA%B6%81%20%EB%85%B8%EC%9B%90%EC%A0%90"
       target="_blank" rel="noopener">
      오시는 길
    </a>

    <footer>소중한 걸음으로 함께해 주세요</footer>
  </main>

  <div class="viewer" id="viewer" hidden>
    <div class="viewer-stage" id="viewer-stage">
      <img id="viewer-img" alt="하린이 사진">
      <video id="viewer-video" playsinline controls hidden></video>
    </div>
    <p class="viewer-caption" id="viewer-caption"></p>
    <div class="viewer-bar">
      <button type="button" id="viewer-prev">이전</button>
      <button type="button" id="viewer-close">닫기</button>
      <button type="button" id="viewer-next">다음</button>
    </div>
  </div>

  <script>
    (function () {
      var seoul = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Seoul",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      });
      var today = seoul.format(new Date());
      var days = Math.round((Date.parse("2026-11-14") - Date.parse(today)) / 86400000);
      var countdown = document.getElementById("countdown");
      if (days > 0) countdown.textContent = "D-" + days;
      else if (days === 0) countdown.textContent = "Today";
      else countdown.hidden = true;

      var birth = "2025-11-16";
      var sources = [
        { src: "사진/2025-11-16_1.jpg", date: "2025-11-16" },
        { src: "사진/2025-11-20_1.jpg", date: "2025-11-20" },
        { src: "사진/2026-01-01_1.jpg", date: "2026-01-01" },
        { src: "사진/2026-01-21_1.jpg", date: "2026-01-21" },
        { src: "사진/2026-02-16_1.jpg", date: "2026-02-16" },
        { src: "사진/2026-02-22_1.jpg", date: "2026-02-22" },
        { src: "사진/2026-03-07_1.jpg", date: "2026-03-07" },
        { src: "사진/2026-03-18_1.jpg", date: "2026-03-18" },
        { src: "사진/2026-04-02_2.jpg", date: "2026-04-02" },
        { src: "사진/2026-04-28_1.jpg", date: "2026-04-28" },
        { src: "사진/2026-05-07_1.jpg", date: "2026-05-07" },
        { src: "사진/2026-05-07_2.jpg", date: "2026-05-07" },
        { src: "사진/2026-06-12_1.jpg", date: "2026-06-12" },
        { src: "사진/2026-06-15_2.jpg", date: "2026-06-15" },
        { src: "사진/2026-08-15_1.jpg", date: "2026-08-15" },
        { src: "사진/2026-10-03_1.jpg", date: "2026-10-03" },
        { src: "사진/2026-10-31_1.jpg", date: "2026-10-31" },
        { src: "사진/2026-11-06_1.jpg", date: "2026-11-06" },
        { src: "사진/2026-11-06_2.jpg", date: "2026-11-06" },
        { src: "사진/2026-11-06_3.jpg", date: "2026-11-06" },
        { src: "사진/2026-11-06_4.jpg", date: "2026-11-06" },
        { src: "사진/2026-11-06_5.jpg", date: "2026-11-06" },
        { src: "사진/2026-11-06_6.jpg", date: "2026-11-06" },
        { src: "사진/2026-11-06_7.jpg", date: "2026-11-06" }
      ];

      function formatDate(iso) {
        var parts = iso.split("-");
        return parts[0] + "년 " + parts[1] + "월 " + parts[2] + "일";
      }

      function daysAfterBirth(iso) {
        return Math.round((Date.parse(iso) - Date.parse(birth)) / 86400000);
      }

      function captionText(item) {
        if (!item.date) return "";
        var days = daysAfterBirth(item.date);
        if (days < 0) return formatDate(item.date) + " · 태어나기 " + (-days) + "일 전";
        return formatDate(item.date) + " · D+" + (days + 1);
      }

      function renderGallery() {
        var section = document.getElementById("gallery");
        var box = document.getElementById("photos");

        var previewCount = 11;
        sources.forEach(function (item, i) {
          if (i >= previewCount) return;
          var figure = document.createElement("figure");
          figure.className = "photo";
          var button = document.createElement("button");
          button.type = "button";
          button.className = "shot";
          if (item.video) {
            button.className = "shot is-video";
            button.setAttribute("aria-label", "영상 재생");
            var thumb = document.createElement("video");
            thumb.muted = true;
            thumb.playsInline = true;
            thumb.preload = "metadata";
            thumb.src = item.src + "#t=0.1";
            thumb.setAttribute("aria-hidden", "true");
            button.appendChild(thumb);
          } else {
            button.setAttribute("aria-label", "하린이 사진 " + (i + 1) + " 크게 보기");
            var img = document.createElement("img");
            img.src = item.src;
            img.alt = "하린이 사진 " + (i + 1);
            button.appendChild(img);
          }
          button.addEventListener("click", function () { openViewer(i); });
          figure.appendChild(button);
          box.appendChild(figure);
        });
        if (sources.length > previewCount) {
          var moreFigure = document.createElement("figure");
          moreFigure.className = "photo";
          var more = document.createElement("button");
          more.type = "button";
          more.className = "more";
          more.setAttribute("aria-label", "나머지 사진 크게 보기");
          var moreLabel = document.createElement("span");
          moreLabel.textContent = "더보기";
          more.appendChild(moreLabel);
          more.addEventListener("click", function () { openViewer(previewCount); });
          moreFigure.appendChild(more);
          box.appendChild(moreFigure);
        }
        section.hidden = false;
      }

      renderGallery();

      var viewer = document.getElementById("viewer");
      var viewerImg = document.getElementById("viewer-img");
      var viewerVideo = document.getElementById("viewer-video");
      var prevBtn = document.getElementById("viewer-prev");
      var nextBtn = document.getElementById("viewer-next");
      var current = 0;

      function stopVideo() {
        viewerVideo.pause();
        viewerVideo.removeAttribute("src");
        viewerVideo.load();
      }

      var showToken = 0;

      function preload(i) {
        var item = sources[(i + sources.length) % sources.length];
        if (item && !item.video) new Image().src = item.src;
      }

      function showCurrent() {
        var item = sources[current];
        var token = ++showToken;
        var caption = document.getElementById("viewer-caption");
        var index = current;
        function updateCaption() {
          var count = (index + 1) + "/" + sources.length;
          caption.textContent = "";
          var text = captionText(item);
          if (text) {
            var dateLine = document.createElement("span");
            dateLine.textContent = text;
            caption.appendChild(dateLine);
          }
          var countLine = document.createElement("span");
          countLine.className = "viewer-count";
          countLine.textContent = count;
          caption.appendChild(countLine);
          caption.hidden = false;
        }
        if (item.video) {
          updateCaption();
          viewerImg.hidden = true;
          viewerVideo.hidden = false;
          viewerVideo.src = item.src;
          viewerVideo.play().catch(function () {});
        } else {
          // 사진을 다 불러온 뒤에 사진과 날짜를 동시에 바꿉니다.
          var loader = new Image();
          loader.onload = loader.onerror = function () {
            if (token !== showToken) return;
            stopVideo();
            viewerVideo.hidden = true;
            viewerImg.hidden = false;
            viewerImg.src = item.src;
            viewerImg.alt = captionText(item) || "하린이 사진";
            updateCaption();
          };
          loader.src = item.src;
        }
        preload(current + 1);
        preload(current - 1);
        var alone = sources.length < 2;
        prevBtn.hidden = alone;
        nextBtn.hidden = alone;
      }

      function openViewer(i) {
        current = i;
        viewerImg.removeAttribute("src");
        document.getElementById("viewer-caption").hidden = true;
        showCurrent();
        viewer.hidden = false;
        document.body.style.overflow = "hidden";
      }

      function closeViewer() {
        stopVideo();
        viewer.hidden = true;
        document.body.style.overflow = "";
      }

      document.getElementById("viewer-close").addEventListener("click", closeViewer);
      prevBtn.addEventListener("click", function () {
        current = (current - 1 + sources.length) % sources.length;
        showCurrent();
      });
      nextBtn.addEventListener("click", function () {
        current = (current + 1) % sources.length;
        showCurrent();
      });
      viewer.addEventListener("click", function (e) {
        if (e.target.closest(".viewer-bar")) return;
        current = (current + 1) % sources.length;
        showCurrent();
      });
      document.addEventListener("keydown", function (e) {
        if (viewer.hidden) return;
        if (e.key === "Escape") closeViewer();
      });
    })();
  </script>
</body>
</html>
